name: CI - Test & Lint

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3
    
    - name: Run unit tests
      run: |
        python test_rschunter.py
    
    - name: Test CLI help
      run: |
        python rschunter.py --help
  
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        pip install flake8 pylint black isort
    
    - name: Check code formatting with black
      run: |
        black --check --diff rschunter.py test_rschunter.py || true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff rschunter.py test_rschunter.py || true
    
    - name: Lint with flake8
      run: |
        flake8 rschunter.py test_rschunter.py --max-line-length=120 --ignore=E501,W503,E203 || true
    
    - name: Lint with pylint
      run: |
        pylint rschunter.py --max-line-length=120 --disable=C0111,R0913,R0914,R0912,R0915 || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        pip install bandit safety
    
    - name: Run bandit security scan
      run: |
        bandit -r rschunter.py -f json -o bandit-report.json || true
    
    - name: Check dependencies for vulnerabilities
      run: |
        pip install requests urllib3
        safety check || true
    
    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: bandit-report.json
