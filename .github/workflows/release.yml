name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install requests urllib3
    
    - name: Run tests
      run: |
        python test_rschunter.py
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Generate changelog
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create release archive
      run: |
        mkdir -p release/rschunter-${{ steps.get_version.outputs.VERSION }}
        cp rschunter.py release/rschunter-${{ steps.get_version.outputs.VERSION }}/
        cp test_rschunter.py release/rschunter-${{ steps.get_version.outputs.VERSION }}/
        cp README.md release/rschunter-${{ steps.get_version.outputs.VERSION }}/
        cd release
        tar -czf rschunter-${{ steps.get_version.outputs.VERSION }}.tar.gz rschunter-${{ steps.get_version.outputs.VERSION }}
        zip -r rschunter-${{ steps.get_version.outputs.VERSION }}.zip rschunter-${{ steps.get_version.outputs.VERSION }}
    
    - name: Generate checksums
      run: |
        cd release
        sha256sum rschunter-${{ steps.get_version.outputs.VERSION }}.tar.gz > checksums.txt
        sha256sum rschunter-${{ steps.get_version.outputs.VERSION }}.zip >> checksums.txt
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: RSC Hunter v${{ steps.get_version.outputs.VERSION }}
        body: |
          ## RSC Hunter v${{ steps.get_version.outputs.VERSION }}
          
          High-performance mass vulnerability scanner for CVE-2025-55182
          
          ### Changes in this release
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ### Installation
          
          ```bash
          # Download and extract
          wget https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION }}/rschunter-${{ steps.get_version.outputs.VERSION }}.tar.gz
          tar -xzf rschunter-${{ steps.get_version.outputs.VERSION }}.tar.gz
          cd rschunter-${{ steps.get_version.outputs.VERSION }}
          
          # Install dependencies
          pip3 install requests urllib3
          
          # Run
          python3 rschunter.py --help
          ```
          
          ### Checksums
          See `checksums.txt` for SHA256 verification
          
          ### What's Included
          - `rschunter.py` - Main scanner tool
          - `test_rschunter.py` - Unit tests
          - `README.md` - Complete documentation
        files: |
          release/rschunter-${{ steps.get_version.outputs.VERSION }}.tar.gz
          release/rschunter-${{ steps.get_version.outputs.VERSION }}.zip
          release/checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
